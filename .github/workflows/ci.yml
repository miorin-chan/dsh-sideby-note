name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # client/client.js is a committed artifact: it is what the shell loads and
      # what the market installs where build scripts are blocked. A stale copy
      # is worse than no copy, so the build must reproduce it byte for byte.
      - name: The committed bundle must match src/client
        run: |
          if ! git diff --exit-code client/; then
            echo "::error file=client/client.js::client/ is a committed build artifact and no longer matches src/client/. Run \`npm run build\` and commit the result. Do not hand-edit it — the next build overwrites any manual change."
            exit 1
          fi
          echo "client/ matches src/client"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # One result per catalog case, plus the machine-readable run record that
      # the release gate and the report are built from.
      - name: Contract and bundle tests
        run: npm run test:run

      - name: Keep the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-run-node${{ matrix.node }}
          path: |
            .test/runs/**/run.json
            .test/runs/**/report.md
            .test/runs/**/report.html
            .test/runs/**/junit.xml
          if-no-files-found: ignore
          retention-days: 30

      # The catalog is the business view of what must be verified; this keeps it
      # bound to the tests, in both directions (no dangling pointers, no ids
      # that were never catalogued).
      - name: The test catalog matches the tests
        run: npm run catalog:check

      # Rules behind a P0 case must carry a human review of their current text.
      # The approval stores a content hash, so editing a reviewed rule fails here
      # until someone re-approves it.
      - name: P0 rules carry a current review
        run: node tools/catalog/review.mjs --strict

      # Every change lands under ## next-released; the release command renames
      # that heading and inserts a fresh one. Catch drift before it reaches main.
      - name: The changelog keeps a next-released section
        run: node tools/release.mjs check-next
