name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install and build
        run: pnpm install --frozen-lockfile

      - name: Verify the reproducible npm tarball
        run: |
          tracked_js="$(git ls-files -- '*.js' '*.mjs')"
          if [[ -n "$tracked_js" ]]; then
            printf 'JavaScript build output is tracked:\n%s\n' "$tracked_js" >&2
            exit 1
          fi
          pack_dir="$(mktemp -d)"
          npm pack --json --pack-destination "$pack_dir" > "$pack_dir/first.json"
          npm pack --json --pack-destination "$pack_dir" > "$pack_dir/second.json"
          cmp "$pack_dir/first.json" "$pack_dir/second.json"
          node --input-type=module - "$pack_dir/first.json" <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, readdirSync } from 'node:fs'

          const [{ files }] = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          const hostModules = readdirSync('host')
            .filter(file => file.endsWith('.ts') && !file.endsWith('.d.ts'))
            .map(file => `host/${file.slice(0, -3)}.js`)
          const paths = files.map(file => file.path)
          assert.deepEqual(paths.filter(path => path.endsWith('.js')).sort(), ['index.js', 'client/client.js', ...hostModules].sort())
          assert.deepEqual(paths.filter(path => path.endsWith('.ts')).sort(), [
            'host/attachment-metadata.ts', 'host/attachment-route.ts', 'host/workspace-migration.ts',
          ])
          assert.deepEqual(files.filter(({ path }) => path.endsWith('.mjs')).map(({ path, mode }) => [path, mode]), [
            ['scripts/install.mjs', 0o755],
          ])
          assert.ok(!paths.some(path => path.endsWith('.mts')))
          assert.equal(readFileSync('scripts/install.mjs', 'utf8').split('\n', 1)[0], '#!/usr/bin/env node')
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Verify build and type pins
        run: |
          node scripts/build.mjs --check
          node scripts/sync-types.mjs --check

      - name: Run code tests
        run: npm test
