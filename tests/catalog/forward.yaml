# 转发回输入框（FWD）
#
# 业务语义：把便笺原文追加到当前会话的输入框，成功后归档。
domain: forward
owner: forward

cases:
  - id: FWD-001
    title: 旧前缀偏好不会影响递入
    priority: P1
    class: B
    rules: [R-FWD-PLAIN]
    risk: ux
    expected:
      - 已有前缀偏好时仍只递入原文，且不改写该偏好
    automation:
      - type: integration
        file: tests/resilience.test.mts
        test: FWD-001 旧前缀偏好不会影响递入
        status: automated
    suites: [pr, nightly, release]
    tags: [legacy, plain-text]

  - id: FWD-002
    title: 递入只写当前可见会话且归档到原工作区
    priority: P0
    class: C
    rules: [R-FWD-TARGET]
    risk: data_loss
    expected:
      - 文本只进入当前可见会话的输入框
      - 另一个会话的输入框保持为空
      - 递入成功后条目在其工作区清单归档
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: FWD-002 递入只写当前可见会话且归档到原工作区
        status: automated
    suites: [pr, nightly, release]
    tags: [forward, workspace]

  - id: FWD-003
    title: 第二条便笺另起一行追加
    priority: P2
    class: B
    rules: [R-FWD-PLAIN]
    risk: ux
    expected:
      - 第二条便笺追加在第一条后，两条原文之间恰好一个换行
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: FWD-003 第二条便笺另起一行追加
        status: automated
    suites: [nightly, release]
    tags: [plain-text, append]

  - id: FWD-004
    title: 递入保留会话现有草稿
    priority: P2
    class: C
    rules: [R-FWD-PLAIN]
    risk: ux
    expected:
      - 现有会话草稿保持原样，随后换行追加便笺原文
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: FWD-004 递入保留会话现有草稿
        status: automated
    suites: [nightly, release]
    tags: [plain-text, append]

  - id: FWD-005
    title: 草稿末尾已有换行时直接追加
    priority: P2
    class: C
    rules: [R-FWD-PLAIN]
    risk: ux
    expected:
      - 在已有换行之后追加便笺，不产生额外空行
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: FWD-005 草稿末尾已有换行时直接追加
        status: automated
    suites: [nightly, release]
    tags: [plain-text, append]

  - id: FWD-006
    title: 归档条目没有再次递入操作
    priority: P2
    class: C
    rules: [R-FWD-ARCHIVE]
    risk: ux
    expected:
      - 第一次递入追加原文并归档便笺
      - 归档条目不再提供递入操作，也不写转发标记
    automation:
      - type: integration
        file: tests/resilience.test.mts
        test: FWD-006 归档条目没有再次递入操作
        status: automated
    suites: [nightly, release]
    tags: [forward, archive]

  - id: FWD-007
    title: 填入保留正文和全部原文件
    priority: P1
    class: A
    rules: [R-FWD-ATTACHMENTS, R-FWD-PLAIN, R-FWD-ARCHIVE]
    risk: ux
    expected:
      - 图片、音频、视频和普通文件按顺序加入当前草稿，已有正文及附件保留
      - 纯附件便笺也可用同一个操作填入并归档
    automation:
      - type: integration
        file: tests/host-bundle.test.mts
        test: FWD-007 填入保留正文和全部原文件
        status: automated
    suites: [pr, nightly, release]
    tags: [forward, attachment, archive]

  - id: FWD-008
    title: 附件不可用或拒收时保留待续便笺
    priority: P1
    class: E
    rules: [R-FWD-ATTACHMENTS, R-FWD-ARCHIVE]
    risk: ux
    expected:
      - 任何原文件读取失败时，便笺保留待续且对话草稿不变
      - 输入框拒收该批文件时，显示失败反馈并保留待续便笺及对话草稿
      - 恢复后重试可填入完整便笺并归档
    automation:
      - type: integration
        file: tests/host-bundle.test.mts
        test: FWD-008 附件不可用或拒收时保留待续便笺
        status: automated
    suites: [pr, nightly, release]
    tags: [forward, attachment, failure]

  - id: FWD-009
    title: 附件读取期间切换会话不写错草稿
    priority: P1
    class: F
    rules: [R-FWD-ATTACHMENTS, R-FWD-TARGET]
    risk: ux
    expected:
      - 附件读取期间同一便笺的重复点击只触发一次操作
      - 会话切换后，在途操作不再写入草稿，便笺保持待续
    automation:
      - type: integration
        file: tests/host-bundle.test.mts
        test: FWD-009 附件读取期间切换会话不写错草稿
        status: automated
    suites: [pr, nightly, release]
    tags: [forward, attachment, session]

  - id: FWD-010
    title: 绑定便笺只在目标会话填入且返回本身不写草稿
    priority: P1
    class: A
    rules: [R-FWD-SESSION-LINK]
    risk: privacy
    expected:
      - 其他会话不可填入，返回绑定会话保持面板打开且不改变任何草稿
      - 在目标会话明确填入后只修改该会话的草稿，并归档原工作区便笺
    automation:
      - type: integration
        file: tests/linked-session-bundle.test.mts
        test: FWD-010 绑定便笺只在目标会话填入且返回本身不写草稿
        status: automated
    suites: [pr, nightly, release]
    tags: [forward, session, navigation]

  - id: FWD-011
    title: 会话不可用或绑定刚变更时不填入
    priority: P1
    class: F
    rules: [R-FWD-SESSION-LINK]
    risk: privacy
    expected:
      - 在跨标签页变更送达界面前也不会通过旧操作写入错误会话
      - 会话找不到时不改写或归档便笺，解绑后恢复普通填入
    automation:
      - type: integration
        file: tests/linked-session-bundle.test.mts
        test: FWD-011 会话不可用或绑定刚变更时不填入
        status: automated
    suites: [pr, nightly, release]
    tags: [forward, session, concurrency]
