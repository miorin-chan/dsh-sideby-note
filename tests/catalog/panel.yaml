# 面板与入口（PANEL）
#
# 业务语义：用户能不能找到入口、面板开在哪儿、设置与可达性是否成立。
domain: panel
owner: panel

cases:
  - id: PANEL-002
    title: header 入口挂进宿主工具行并显示未完成数
    priority: P0
    class: A
    rules: [R-PANEL-ENTRY]
    risk: crash
    expected:
      - 入口按钮出现在宿主工具行内，并带上会话标识
      - 无未完成记录时角标隐藏
      - 有未完成记录时角标显示数量
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: PANEL-002 header 入口挂进宿主工具行并显示未完成数
        status: automated
    suites: [smoke, pr, nightly, release]
    tags: [header-entry, badge]

  - id: PANEL-003
    title: 点击入口打开面板并渲染标题
    priority: P1
    class: A
    rules: [R-PANEL-ENTRY, R-PANEL-COPY]
    risk: crash
    expected:
      - 点击入口后面板出现在页面里
      - 标题与输入框占位来自当前语言词典
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: PANEL-003 点击入口打开面板并渲染标题
        status: automated
    suites: [smoke, pr, nightly, release]
    tags: [panel, i18n]

  - id: PANEL-004
    title: 设置卡片可打开并展示产品身份与存储状态
    priority: P1
    class: B
    rules: [R-PANEL-SETTINGS, R-PANEL-COPY]
    risk: ux
    expected:
      - 齿轮打开设置卡片并标记面板进入设置态
      - 「关于」展示产品身份
      - 数据存储独立展示，旧快捷键与转发前缀选项不出现
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: PANEL-004 设置卡片可打开并展示产品身份与存储状态
        status: automated
    suites: [pr, nightly, release]
    tags: [settings, persistence]

  - id: PANEL-005
    title: 使用面板和设置不会上报统计
    priority: P1
    class: C
    rules: [R-PANEL-NO-ANALYTICS]
    risk: privacy
    expected:
      - 设置没有匿名统计开关，也不写旧版统计偏好
      - 打开面板与设置仅访问明确的更新与存储端点，不发送统计事件
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: PANEL-005 使用面板和设置不会上报统计
        status: automated
    suites: [pr, nightly, release]
    tags: [privacy, analytics]

  - id: PANEL-006
    title: 键盘调整面板宽度并持久化
    priority: P2
    class: C
    rules: [R-PANEL-GEOMETRY]
    risk: ux
    expected:
      - 右侧面板提供宽度手柄
      - 方向键调整后写入宽度偏好
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: PANEL-006 键盘调整面板宽度并持久化
        status: automated
    suites: [nightly, release]
    tags: [geometry, keyboard]

  - id: PANEL-007
    title: 分区折叠状态持久化
    priority: P2
    class: B
    rules: [R-PANEL-SECTIONS]
    risk: ux
    expected:
      - 折叠/展开写入分区偏好
      - 重开面板保持该状态
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: PANEL-007 分区折叠状态持久化
        status: automated
    suites: [nightly, release]
    tags: [sections, persistence]

  - id: PANEL-008
    title: 空白新会话把入口挂在右上角并显示工作区计数
    priority: P1
    class: B
    rules: [R-PANEL-ENTRY, R-SCOPE-BLANK]
    risk: crash
    expected:
      - hero 座位只捕获上下文，不渲染第二个入口
      - 没有会话工具行时入口落在 header 角落
      - 角标显示工作区未完成数
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: PANEL-008 空白新会话把入口挂在右上角并显示工作区计数
        status: automated
    suites: [pr, nightly, release]
    tags: [header-entry, blank-session]

  # —— 由 R-PANEL-GEOMETRY / R-NOTE-CONFIRM 推导，尚无实现 ——
  - id: PANEL-009
    title: 面板宽度夹在 280 到 720 之间
    priority: P2
    class: C
    rules: [R-PANEL-GEOMETRY]
    risk: ux
    expected:
      - 持续调大不超过 720，也不超过视口可用宽度
      - 持续调小不低于 280
    automation:
      - type: integration
        file: tests/resilience.test.mjs
        test: PANEL-009 面板宽度夹在 280 到 720 之间
        status: automated
    suites: [nightly, release]
    tags: [boundary, geometry]

  - id: PANEL-010
    title: 清除确认 5 秒后失效
    priority: P2
    class: C
    rules: [R-NOTE-CONFIRM]
    risk: data_loss
    expected:
      - 5 秒内不操作时确认条自动消失
      - 消失后再点一次清除，需要重新确认而不是直接删除
    automation:
      - type: integration
        file: tests/resilience.test.mjs
        test: PANEL-010 清除确认 5 秒后失效
        status: automated
    suites: [nightly, release]
    tags: [timing, confirm]
