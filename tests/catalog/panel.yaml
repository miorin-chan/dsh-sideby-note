# 面板与入口（PANEL）
#
# 业务语义：用户能不能找到入口、面板开在哪儿、页脚详情是否可达。
domain: panel
owner: panel

cases:
  - id: PANEL-002
    title: header 入口挂进宿主工具行并显示未完成数
    priority: P0
    class: A
    rules: [R-PANEL-ENTRY]
    risk: crash
    expected:
      - 入口按钮出现在宿主工具行内，并带上会话标识
      - 无未完成记录时角标隐藏
      - 有未完成记录时角标显示数量
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: PANEL-002 header 入口挂进宿主工具行并显示未完成数
        status: automated
    suites: [smoke, pr, nightly, release]
    tags: [header-entry, badge]

  - id: PANEL-003
    title: 点击入口打开面板并渲染标题
    priority: P1
    class: A
    rules: [R-PANEL-ENTRY, R-PANEL-COPY]
    risk: crash
    expected:
      - 点击入口后面板出现在页面里
      - 标题与输入框占位来自当前语言词典
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: PANEL-003 点击入口打开面板并渲染标题
        status: automated
    suites: [smoke, pr, nightly, release]
    tags: [panel, i18n]

  - id: PANEL-004
    title: 页脚存储详情默认折叠并在展开后展示存储信息
    priority: P1
    class: B
    rules: [R-PANEL-FOOTER, R-PANEL-COPY]
    risk: ux
    expected:
      - 正常页脚折叠时只显示「存储」
      - 展开后才显示存储信息
      - 焦点位于「存储」时按 Escape 关闭面板并将焦点还给入口
      - 齿轮、设置卡、旧快捷键和转发前缀选项均已移除
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: PANEL-004 页脚存储详情默认折叠并在展开后展示存储信息
        status: automated
      - type: integration
        file: tests/bundle.test.mts
        test: Escape returns focus from the footer to the panel entry
        status: automated
    suites: [pr, nightly, release]
    tags: [footer, storage]

  - id: PANEL-005
    title: 使用面板和存储详情不会上报统计
    priority: P1
    class: C
    rules: [R-PANEL-NO-ANALYTICS]
    risk: privacy
    expected:
      - 存储详情没有匿名统计开关，也不写旧版统计偏好
      - 打开面板与存储详情仅访问明确的存储端点，不发送统计事件
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: PANEL-005 使用面板和存储详情不会上报统计
        status: automated
    suites: [pr, nightly, release]
    tags: [privacy, analytics]

  - id: PANEL-006
    title: 键盘调整面板宽度并持久化
    priority: P2
    class: C
    rules: [R-PANEL-GEOMETRY]
    risk: ux
    expected:
      - 右侧面板提供宽度手柄
      - 方向键调整后写入宽度偏好
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: PANEL-006 键盘调整面板宽度并持久化
        status: automated
    suites: [nightly, release]
    tags: [geometry, keyboard]

  - id: PANEL-007
    title: 分区折叠状态持久化
    priority: P2
    class: B
    rules: [R-PANEL-SECTIONS]
    risk: ux
    expected:
      - 折叠/展开写入分区偏好
      - 重开面板保持该状态
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: PANEL-007 分区折叠状态持久化
        status: automated
    suites: [nightly, release]
    tags: [sections, persistence]

  - id: PANEL-008
    title: 空白新会话把入口挂在右上角并显示工作区计数
    priority: P1
    class: B
    rules: [R-PANEL-ENTRY, R-SCOPE-BLANK]
    risk: crash
    expected:
      - hero 座位只捕获上下文，不渲染第二个入口
      - 没有会话工具行时入口落在 header 角落
      - 角标显示工作区未完成数
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: PANEL-008 空白新会话把入口挂在右上角并显示工作区计数
        status: automated
    suites: [pr, nightly, release]
    tags: [header-entry, blank-session]

  # —— 由 R-PANEL-GEOMETRY / R-NOTE-CONFIRM 推导，尚无实现 ——
  - id: PANEL-009
    title: 面板宽度夹在 280 到 720 之间
    priority: P2
    class: C
    rules: [R-PANEL-GEOMETRY]
    risk: ux
    expected:
      - 持续调大不超过 720，也不超过视口可用宽度
      - 持续调小不低于 280
      - 视口缩到 390 时重新计算右侧偏移，保留两侧至少 12 的边距
    automation:
      - type: integration
        file: tests/resilience.test.mts
        test: PANEL-009 面板宽度夹在 280 到 720 之间
        status: automated
    suites: [nightly, release]
    tags: [boundary, geometry]

  - id: PANEL-010
    title: 清除确认 5 秒后失效
    priority: P2
    class: C
    rules: [R-NOTE-CONFIRM]
    risk: data_loss
    expected:
      - 5 秒内不操作时确认条自动消失
      - 消失后再点一次清除，需要重新确认而不是直接删除
    automation:
      - type: integration
        file: tests/resilience.test.mts
        test: PANEL-010 清除确认 5 秒后失效
        status: automated
    suites: [nightly, release]
    tags: [timing, confirm]

  - id: PANEL-011
    title: DSH 快捷键切换面板并跟随当前绑定
    priority: P1
    class: B
    rules: [R-PANEL-SHORTCUT]
    risk: ux
    expected:
      - 桌面版声明 Mod+E，macOS 和 Windows 浏览器版声明 Mod+Alt+E
      - 命令只在可见入口且无模态对话框时切换面板
      - 改键和解绑后提示及辅助技术属性随之更新，卸载后注销命令
    automation:
      - type: integration
        file: tests/resilience.test.mts
        test: PANEL-011 DSH 快捷键切换面板并跟随当前绑定
        status: automated
    suites: [pr, nightly, release]
    tags: [keyboard, header-entry]

  - id: PANEL-012
    title: 点击面板外收起且保留目标操作与草稿
    priority: P1
    class: B
    rules: [R-PANEL-OUTSIDE-CLICK]
    risk: ux
    expected:
      - 点击面板外部时收起，目标照常执行并保留焦点
      - 面板内点击与从面板内开始的手势不触发收起
      - 入口仍可切换面板，重开后保留草稿
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: PANEL-012 点击面板外收起且保留目标操作与草稿
        status: automated
    suites: [pr, nightly, release]
    tags: [header-entry, focus]
