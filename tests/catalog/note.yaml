# 便笺内容与生命周期（NOTE）
#
# 业务语义：用户写了什么、留下什么。这里的 expected 是验收标准，
# 只能由人修改；重构、改名只允许调整 automation 指针。
domain: note
owner: note

cases:
  - id: NOTE-001
    title: 经表单新增便笺写入存储并刷新角标
    priority: P0
    class: A
    rules: [R-NOTE-PERSIST, R-NOTE-TEXT, R-STORE-WRITE-FAIL]
    risk: data_loss
    expected:
      - 输入为空时「添加」按钮不可用
      - 提交后该条出现在列表，并写入当前清单对应的存储键
      - 入口角标在下一帧内加一
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: NOTE-001 经表单新增便笺写入存储并刷新角标
        status: automated
    suites: [smoke, pr, nightly, release]
    tags: [persistence, badge]

  - id: NOTE-002
    title: 归档便笺与清除归档需二次确认
    priority: P0
    class: C
    rules: [R-NOTE-CONFIRM]
    risk: data_loss
    expected:
      - 递入会话后该条进入归档分区，角标减一
      - 清除已完成先出现确认，第二次点击才删除
      - 删除只影响已完成条目，未完成条目保留
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: NOTE-002 归档便笺与清除归档需二次确认
        status: automated
    suites: [pr, nightly, release]
    tags: [destructive, confirm]

  - id: NOTE-003
    title: 退回顶部输入框后可续写并持久化
    priority: P1
    class: B
    rules: [R-NOTE-LIFECYCLE]
    risk: data_loss
    expected:
      - 已有草稿时保留草稿和原条目；空输入框可接收退回的条目
      - 退回后移除原条目；修改后重新提交，文本进入待续清单
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: NOTE-003 退回顶部输入框后可续写并持久化
        status: automated
    suites: [pr, nightly, release]
    tags: [edit, persistence]

  - id: NOTE-004
    title: 删除最后一条后回到空状态
    priority: P1
    class: B
    rules: [R-NOTE-LIFECYCLE]
    risk: ux
    expected:
      - 删除后存储中该清单为空
      - 面板回落到空状态并显示引导文案
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: NOTE-004 删除最后一条后回到空状态
        status: automated
    suites: [pr, nightly, release]
    tags: [delete, empty-state]

  - id: NOTE-005
    title: 纯空白文本不产生记录
    priority: P1
    class: D
    rules: [R-NOTE-TEXT]
    risk: ux
    expected:
      - 只含空格、制表符或换行的输入不能提交，且不产生空条目
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: NOTE-005 纯空白文本不产生记录
        status: automated
    suites: [pr, nightly, release]
    tags: [validation, whitespace]

  - id: NOTE-006
    title: 超长文本截断到 280 字符
    priority: P1
    class: C
    rules: [R-NOTE-TEXT]
    risk: data_loss
    expected:
      - 280 字符原样保存
      - 281 字符只保留前 280 个字符，不报错也不丢整条
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: NOTE-006 超长文本截断到 280 字符
        status: automated
    suites: [pr, nightly, release]
    tags: [validation, boundary]

  - id: NOTE-007
    title: 已完成条目按完成时间倒序
    priority: P2
    class: C
    rules: [R-NOTE-ORDER]
    risk: ux
    expected:
      - 后完成的条目排在已完成分区最前
    automation:
      - type: integration
        file: tests/resilience.test.mts
        test: NOTE-007 已完成条目按完成时间倒序
        status: automated
    suites: [nightly, release]
    tags: [ordering]

  - id: NOTE-008
    title: 归档条目退回后可重新提交到待续区
    priority: P1
    class: C
    rules: [R-NOTE-LIFECYCLE]
    risk: ux
    expected:
      - 归档条目退回顶部输入框，归档中的原件消失
      - 重新提交后条目不带归档时间，角标相应加一
    automation:
      - type: integration
        file: tests/resilience.test.mts
        test: NOTE-008 归档条目退回后可重新提交到待续区
        status: automated
    suites: [pr, nightly, release]
    tags: [state-transition]

  - id: NOTE-009
    title: 相对时间按经过时长分档
    priority: P2
    class: C
    rules: [R-NOTE-AGE]
    risk: ux
    expected:
      - 30 秒前显示「刚刚」，2 分钟前、3 小时前、2 天前分别按分钟、小时、天显示
      - 超过 7 天显示日期
    automation:
      - type: integration
        file: tests/resilience.test.mts
        test: NOTE-009 相对时间按经过时长分档
        status: automated
    suites: [nightly, release]
    tags: [time, copy]

  - id: NOTE-010
    title: 待续便笺支持键盘和拖动排序
    priority: P1
    class: C
    rules: [R-NOTE-ORDER]
    risk: ux
    expected:
      - 在左侧操作按钮上按方向键移动，保留焦点且条目不能越过列表边界
      - 直接拖动正文后保存并显示新顺序，按 Escape 取消时维持原顺序
      - 从填入按钮起拖不会触发排序
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: NOTE-010 键盘调整待续排序并保留焦点
        status: automated
      - type: integration
        file: tests/bundle.test.mts
        test: NOTE-010 拖动调整排序且 Escape 取消拖动
        status: automated
    suites: [pr, nightly, release]
    tags: [ordering, keyboard, drag]

  - id: NOTE-011
    title: 附件可选择粘贴拖放并随便笺恢复
    priority: P1
    class: B
    rules: [R-NOTE-ATTACHMENTS]
    risk: data_loss
    expected:
      - 选取、粘贴、原图和外部拖放的文件按顺序进入草稿，面板重开后可恢复
      - 图片可通过原生画廊预览，附件可以单独提交、下载、移除与退回
    automation:
      - type: integration
        file: tests/host-bundle.test.mts
        test: NOTE-011 附件可选择粘贴拖放并随便笺恢复
        status: automated
    suites: [pr, nightly, release]
    tags: [attachment, persistence]

  - id: NOTE-012
    title: 拒绝无效附件并保留上传失败前的草稿
    priority: P1
    class: D
    rules: [R-NOTE-ATTACHMENTS]
    risk: data_loss
    expected:
      - 空文件在请求宿主前被拒绝
      - 上传失败保留正文和失败卡片，重试成功或移除后才可提交
      - 每个文件显示独立进度，移除中的文件不会在请求结束后恢复
    automation:
      - type: integration
        file: tests/host-bundle.test.mts
        test: NOTE-012 拒绝无效附件并保留上传失败前的草稿
        status: automated
    suites: [pr, nightly, release]
    tags: [attachment, validation]

  - id: NOTE-013
    title: 从主输入框移入文本草稿并保留未保存内容
    priority: P1
    class: C
    rules: [R-NOTE-CHAT-DRAFT, R-NOTE-PERSIST, R-SCOPE-SAVE]
    risk: data_loss
    expected:
      - 空草稿时按钮不可用，280 字符的文本保存到当前工作区后清空原草稿
      - 超长、带附件或写入失败时草稿保留，且没有新便笺
      - 保存期间连点只创建一条，后续编辑仍留在输入框
      - 引用、引文和首尾格式留在原草稿，键盘提交清空后焦点返回输入框
    automation:
      - type: integration
        file: tests/host-bundle.test.mts
        test: NOTE-013 从主输入框移入文本草稿并保留未保存内容
        status: automated
    suites: [pr, nightly, release]
    tags: [composer, persistence, concurrency]

  - id: NOTE-014
    title: 可选绑定不改变工作区且随退回草稿保留
    priority: P1
    class: B
    rules: [R-NOTE-SESSION-LINK]
    risk: ux
    expected:
      - 新增默认绑定当前会话，可在录入区解绑，提交后的下一条恢复默认
      - 旧条目不自动绑定，退回、重开和重新提交保留原绑定和原工作区，已有条目可解绑再绑定到当前会话
    automation:
      - type: integration
        file: tests/linked-session-bundle.test.mts
        test: NOTE-014 可选绑定不改变工作区且随退回草稿保留
        status: automated
    suites: [pr, nightly, release]
    tags: [session, recall, workspace]
