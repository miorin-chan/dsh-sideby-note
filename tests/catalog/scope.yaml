# 清单范围与归属（SCOPE）
#
# 业务语义：便笺的工作区归属决定写入位置，筛选决定显示范围。
# 这是本插件最容易出错、也最伤用户信任的一块。
domain: scope
owner: scope

cases:
  - id: SCOPE-001
    title: 首次见到工作区时一次性并入成员会话便笺
    priority: P0
    class: B
    rules: [R-SCOPE-SEED]
    risk: data_loss
    expected:
      - 第一次捕获工作区时创建共享清单
      - 两组成员会话的便笺分别并入所属工作区，已经并入过的会话仍补入不同 ID 的条目
      - 成功迁移后移除浏览器的旧会话记录，工作区数据写入工作区键
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: SCOPE-001 首次见到工作区时一次性并入成员会话便笺
        status: automated
    suites: [pr, nightly, release]
    tags: [migration, workspace]

  - id: SCOPE-002
    title: 面板默认工作区范围并显示本地存储提示
    priority: P1
    class: C
    rules: [R-SCOPE-DEFAULT, R-PANEL-COPY]
    risk: ux
    expected:
      - 范围开关有「全局」「工作区」两项，默认选中工作区
      - 展开页脚「存储与更新」后说明便笺仍保存在本浏览器
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: SCOPE-002 面板默认工作区范围并显示本地存储提示
        status: automated
    suites: [pr, nightly, release]
    tags: [scope-switch]

  - id: SCOPE-003
    title: 全局范围汇总各工作区便笺
    priority: P1
    class: B
    rules: [R-SCOPE-DEFAULT]
    risk: ux
    expected:
      - 全局显示两个工作区的便笺，相同原始 ID 的行可分别操作
      - 工作区图标和名称在便笺内容下方共用一个链接式按钮，填入按钮在正文左侧
      - 点击当前工作区按钮保留会话，点击其他工作区的图标或名称在目标工作区打开新会话
      - 选择写入存储，入口角标跟随所选范围
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: SCOPE-003 全局范围汇总各工作区便笺
        status: automated
    suites: [pr, nightly, release]
    tags: [scope-switch, badge]

  - id: SCOPE-004
    title: 切回工作区恢复共享清单并记住选择
    priority: P1
    class: B
    rules: [R-SCOPE-DEFAULT]
    risk: ux
    expected:
      - 切回后恢复共享清单内容
      - 选择持久化，重开面板保持
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: SCOPE-004 切回工作区恢复共享清单并记住选择
        status: automated
    suites: [pr, nightly, release]
    tags: [scope-switch]

  - id: SCOPE-005
    title: 工作区范围新增便笺落在共享清单
    priority: P0
    class: B
    rules: [R-SCOPE-SAVE, R-DRAFT-SCOPE]
    risk: data_loss
    expected:
      - 新增条目进入工作区清单
      - 会话键不被再次写入
      - 提交后共享草稿被消费
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: SCOPE-005 工作区范围新增便笺落在共享清单
        status: automated
    suites: [pr, nightly, release]
    tags: [persistence, workspace]

  - id: SCOPE-006
    title: 另一个会话打开同一工作区读到同一清单
    priority: P0
    class: B
    rules: [R-SCOPE-DEFAULT]
    risk: data_loss
    expected:
      - 同一工作区的另一个会话看到同样的条目
      - 新写入的条目对另一会话可见
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: SCOPE-006 另一个会话打开同一工作区读到同一清单
        status: automated
    suites: [pr, nightly, release]
    tags: [workspace, sharing]

  - id: SCOPE-007
    title: 全局范围新增便笺写入当前工作区
    priority: P1
    class: B
    rules: [R-SCOPE-SAVE, R-DRAFT-SCOPE]
    risk: data_loss
    expected:
      - 在全局范围提交时写入当前工作区清单
      - 另一工作区清单保持原样
      - 提交后共享草稿被消费
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: SCOPE-007 全局范围新增便笺写入当前工作区
        status: automated
    suites: [pr, nightly, release]
    tags: [persistence, scope-switch]

  - id: SCOPE-008
    title: 空白会话可切换筛选并写入工作区
    priority: P1
    class: C
    rules: [R-SCOPE-BLANK]
    risk: ux
    expected:
      - 有工作区绑定的空白新会话可在「全局」「工作区」之间切换
      - 此时写入的便笺进入工作区清单
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: SCOPE-008 空白会话可切换筛选并写入工作区
        status: automated
    suites: [pr, nightly, release]
    tags: [blank-session]

  - id: SCOPE-009
    title: 首轮对话后入口迁移并保留筛选
    priority: P1
    class: B
    rules: [R-SCOPE-BLANK, R-PANEL-ENTRY]
    risk: ux
    expected:
      - 面板保持打开，入口从 header 角落移到对话工具行
      - 保留原筛选，新增便笺仍写入当前工作区
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: SCOPE-009 首轮对话后入口迁移并保留筛选
        status: automated
    suites: [pr, nightly, release]
    tags: [blank-session, header-entry]

  - id: SCOPE-010
    title: 无工作区时只显示全局并写入未归属清单
    priority: P1
    class: D
    rules: [R-SCOPE-NOWORKSPACE]
    risk: data_loss
    expected:
      - 没有工作区绑定的空白会话只提供「全局」范围，仍可见其他工作区的便笺
      - 新便笺进入保留的未归属工作区清单，其他工作区保持原样，旧会话键不产生记录
    automation:
      - type: integration
        file: tests/resilience.test.mjs
        test: SCOPE-010 无工作区时只显示全局并写入未归属清单
        status: automated
    suites: [pr, nightly, release]
    tags: [scope, fallback]

  - id: SCOPE-011
    title: 空白会话遵循显式全局选择
    priority: P1
    class: D
    rules: [R-SCOPE-DEFAULT]
    risk: data_loss
    expected:
      - 全局偏好在空白新会话中生效，原有便笺仍可见
      - 已保存的范围选择不被改写
    automation:
      - type: integration
        file: tests/resilience.test.mjs
        test: SCOPE-011 空白会话遵循显式全局选择
        status: automated
    suites: [pr, nightly, release]
    tags: [scope, blank-session]

  - id: SCOPE-012
    title: 迁移失败时保留源记录且重试不重复
    priority: P2
    class: E
    rules: [R-SCOPE-SEED]
    risk: data_loss
    expected:
      - 写入工作区失败时，旧会话记录保持原样
      - 重试成功后移除源记录，每条便笺只出现一次
      - 再次打开工作区时，已迁移的清单保持原样
    automation:
      - type: integration
        file: tests/resilience.test.mjs
        test: SCOPE-012 迁移失败时保留源记录且重试不重复
        status: automated
    suites: [pr, nightly, release]
    tags: [idempotent, workspace]

  - id: SCOPE-013
    title: 切换范围本身不写入任何清单
    priority: P2
    class: C
    rules: [R-SCOPE-SAVE]
    risk: ux
    expected:
      - 往返切换筛选时，便笺存储内容完全一致
      - 草稿在往返切换后仍在输入框里
    automation:
      - type: integration
        file: tests/resilience.test.mjs
        test: SCOPE-013 切换范围本身不写入任何清单
        status: automated
    suites: [pr, nightly, release]
    tags: [scope-switch, draft]

  - id: SCOPE-014
    title: 全局范围操作更新便笺所属工作区
    priority: P1
    class: B
    rules: [R-SCOPE-OWNER, R-FWD-TARGET]
    risk: data_loss
    expected:
      - 在全局递入另一工作区的便笺，正文写入当前对话，归档写入原工作区
      - 退回时从原工作区移除，再提交时回到原工作区
      - 当前工作区即使有同 ID 的条目也保持原样
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: SCOPE-014 全局范围操作更新便笺所属工作区
        status: automated
    suites: [pr, nightly, release]
    tags: [scope, workspace, ownership]

  - id: SCOPE-015
    title: 面板内跳转工作区时保持面板打开
    priority: P1
    class: B
    rules: [R-SCOPE-DEFAULT, R-SCOPE-OWNER]
    risk: ux
    expected:
      - 跳转时面板和列表保持打开，新的页头入口显示已展开
      - 目标会话选中后，录入区切换到目标工作区草稿，原工作区草稿保留
      - 通过其他入口切换会话仍会收起面板
    automation:
      - type: integration
        file: tests/bundle.test.mjs
        test: SCOPE-015 面板内跳转工作区时保持面板打开
        status: automated
    suites: [pr, nightly, release]
    tags: [scope, workspace, draft]
