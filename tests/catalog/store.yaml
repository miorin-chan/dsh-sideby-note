  # —— 宿主存储（R-STORE-HOST-*） ——
  - id: STORE-019
    title: 首次启动把浏览器便笺迁移到宿主并写模式标记
    priority: P0
    class: A
    rules: [R-STORE-HOST-SWITCH, R-STORE-HOST-FILE]
    risk: data_loss
    expected:
      - 宿主为空时，启动后浏览器旧便笺与上游兼容元数据一同迁入宿主
      - 元数据仅用于兼容上游数据，边记部界面继续使用自己的递入和发送行为
      - 写入 storage-mode=host 标记
      - 宿主启动时将旧会话条目移入未归属清单，新便笺也写入该清单
      - 原浏览器副本保留供恢复
    automation:
      - type: integration
        file: tests/host-bundle.test.mts
        test: STORE-019 首次启动把浏览器便笺迁移到宿主并写模式标记
        status: automated
    suites: [smoke, pr, nightly, release]
    tags: [host, migration, boot]

