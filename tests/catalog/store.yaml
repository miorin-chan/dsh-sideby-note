    expected:
      - 非对象与空文本条目被丢弃，列表不出现 undefined
      - 重复 id 被重新分配，非布尔 done 读作 false
      - 清洗后的记录写回存储，同一条不会变成两条
    automation:
      - type: integration
        file: tests/resilience.test.mts
        test: STORE-017 畸形记录被清洗而不是渲染成乱码
        status: automated
    suites: [pr, nightly, release]
    tags: [sanitize, legacy]

  - id: STORE-018
