  # —— 由 R-STORE-READ-FAIL / R-STORE-WRITE-FAIL / R-STORE-SYNC 推导 ——
  - id: STORE-011
    title: 存储读不到时按空继续且不丢输入
    priority: P1
    class: E
    rules: [R-STORE-READ-FAIL, R-STORE-WRITE-FAIL]
    risk: data_loss
    expected:
      - 读取按空处理，面板仍能打开
      - 提交失败时输入内容留在输入框，并明确提示保存失败
      - 界面不显示一条实际没存进去的便笺
    automation:
      - type: integration
        file: tests/resilience.test.mts
        test: STORE-011 存储读不到时按空继续且不丢输入
        status: automated
    suites: [pr, nightly, release]
    tags: [failure-injection, storage]

  - id: STORE-012
    title: 写入失败时读取不降级且保留输入
    priority: P0
    class: E
    rules: [R-STORE-WRITE-FAIL, R-NOTE-PERSIST]
    risk: data_loss
    waiver: 计划在批 2 实现。
    expected:
      - setItem 抛错（浏览器配额/磁盘/只读）时写入返回失败，但读取仍照常显示已保存的便笺
      - 便笺行不被删除，输入框不被清空，出现失败提示
      - 恢复存储后重载，不会出现半条记录
    automation:
      - type: integration
        file: tests/resilience.test.mts
        test: STORE-012 写入失败时读取不降级且保留输入
        status: automated
    suites: [pr, nightly, release]
    tags: [failure-injection, quota, disk]

  - id: STORE-016
    title: 另一个标签页写入后本页视图同步
    priority: P1
    class: F
    rules: [R-STORE-SYNC]
    risk: ux
    expected:
      - 另一标签页新增或删除后，本页入口角标与已打开面板自行刷新
      - 不需要用户重开面板或刷新页面
    automation:
      - type: integration
        file: tests/resilience.test.mts
        test: STORE-016 另一个标签页写入后本页视图同步
