# 存储与草稿（STORE）
#
# 业务语义：数据放在哪、能不能丢、写失败怎么办。浏览器回退与宿主模式各自只有一个数据源。
domain: store
owner: store

cases:
  - id: STORE-001
    title: 宿主不可用时启动保留既有便笺且不切换
    priority: P0
    class: B
    rules: [R-STORE-V1, R-STORE-HOST-UNAVAILABLE]
    risk: data_loss
    expected:
      - 启动后既有清单与偏好原样保留
      - 宿主不可用时留在浏览器，不写模式标记
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: STORE-001 宿主不可用时启动保留既有便笺且不切换
        status: automated
    suites: [smoke, pr, nightly, release]
    tags: [persistence, boot, fallback]

  - id: STORE-002
    title: 会话草稿并入工作区键并退役旧副本
    priority: P0
    class: B
    rules: [R-DRAFT-MIGRATE]
    risk: data_loss
    expected:
      - 首次打开时把成员会话草稿并入工作区键
      - 旧会话副本被移除，不会再次出现
      - 打开后输入框直接带出旧草稿文本
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: STORE-002 会话草稿并入工作区键并退役旧副本
        status: automated
    suites: [pr, nightly, release]
    tags: [draft, migration]

  - id: STORE-003
    title: 草稿在范围切换后保留
    priority: P1
    class: B
    rules: [R-DRAFT-SCOPE]
    risk: ux
    expected:
      - 在一种范围里输入的草稿写入工作区键
      - 切到另一种范围再切回来，草稿仍在
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: STORE-003 草稿在范围切换后保留
        status: automated
    suites: [pr, nightly, release]
    tags: [draft, scope-switch]

  - id: STORE-004
    title: 退回形成的草稿在范围切换后保留
    priority: P2
    class: B
    rules: [R-DRAFT-SCOPE]
    risk: ux
    expected:
      - 退回把条目移入顶部输入框，用户可继续编辑
      - 切换范围后草稿依然可见，提交后回到原工作区
    automation:
      - type: integration
        file: tests/bundle.test.mts
        test: STORE-004 退回形成的草稿在范围切换后保留
        status: automated
    suites: [nightly, release]
    tags: [draft, edit]

  - id: STORE-005
